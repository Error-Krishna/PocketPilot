services:
  - type: web
    name: pocketpilot-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: pocketpilot
      - key: CORS_ORIGINS
        value: "*"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
